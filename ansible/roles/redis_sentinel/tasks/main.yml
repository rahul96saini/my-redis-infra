---
- name: Update apt cache and install Redis
  apt:
    name: redis-server
    update_cache: yes
    state: present

- name: Deploy custom redis.conf template
  template:
    src: redis.conf.j2
    dest: /etc/redis/redis.conf
    owner: redis
    group: redis
    mode: '0644'
  notify: restart redis

- name: Deploy custom sentinel.conf template
  template:
    src: sentinel.conf.j2
    dest: /etc/redis/sentinel.conf
    owner: redis
    group: redis
    mode: '0644'
  notify: restart sentinel

- name: Ensure Redis and Sentinel services are started and enabled
  systemd:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - redis-server
    - redis-sentinel